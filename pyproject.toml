[project]
name = "tfm-dirty-values"
version = "0.1.0"
description = "Preregistered feature-value corruption audit for tabular foundation models"
requires-python = "==3.11.*"
dependencies = [
  "lightgbm==4.7.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "psutil==7.2.2",
  "pyyaml==6.0.3",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "tabicl==2.1.1",
  "tabpfn==2.2.1",
  "torch==2.10.0+cu128",
  "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
tfm-dirty-audit = "tfm_dirty_values.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfm_dirty_values"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

